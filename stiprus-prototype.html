<!doctype html>
<html lang="lt"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Athmore – sportininko savijauta</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Manrope:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F7F1EE;--sf:#FFFCFA;--ink:#2B1B1E;--mut:#6E5C60;--ln:#E8DCD9;--pri:#772F34;--onpri:#fff;--acc:#C9973A;--ok:#3F6A49;--bad:#B3263E;--hero:#3A1B22;--onhero:#F7F1EE;--mint:#F1DEE1;--grad:linear-gradient(135deg,#7A2E35,#98424A);--fd:'Cormorant Garamond',Georgia,serif;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#F7F1EE;--sf:#FFFCFA;--ink:#2B1B1E;--mut:#6E5C60;--ln:#E8DCD9;--pri:#772F34;--onpri:#fff;--acc:#C9973A;--ok:#3F6A49;--bad:#B3263E;--hero:#3A1B22;--onhero:#F7F1EE;--mint:#F1DEE1;--grad:linear-gradient(135deg,#7A2E35,#98424A);color-scheme:light}}
:root[data-theme="dark"]{--bg:#F7F1EE;--sf:#FFFCFA;--ink:#2B1B1E;--mut:#6E5C60;--ln:#E8DCD9;--pri:#772F34;--onpri:#fff;--acc:#C9973A;--ok:#3F6A49;--bad:#B3263E;--hero:#3A1B22;--onhero:#F7F1EE;--mint:#F1DEE1;--grad:linear-gradient(135deg,#7A2E35,#98424A);color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:500 16px/1.5 Manrope,system-ui,sans-serif}
.app{max-width:480px;margin:0 auto;padding:20px 16px 110px}
h1,h2,h3{font-family:var(--fd);margin:0;letter-spacing:-.02em;line-height:1.1}
h1{font-size:32px;font-weight:800}h2{font-size:21px;font-weight:800;margin:26px 0 4px}h3{font-size:17px;font-weight:700;margin-bottom:10px}
p{margin:6px 0}.mut,small{color:var(--mut)}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:18px;padding:16px;margin-top:12px}
.hero{background:var(--hero);color:var(--onhero);border:1.5px solid var(--pri);border-radius:28px;padding:24px 22px;margin-top:16px}
.q{font:800 27px/1.15 var(--fd);margin:0 0 18px;letter-spacing:-.02em}
.btn{background:var(--grad);color:#0B0B0B;border:1.5px solid var(--pri);border-radius:12px;padding:12px 18px;font:700 15px Manrope,sans-serif;min-height:44px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--pri);border:1.5px solid var(--pri)}
.btn.lite{background:var(--grad);color:#0B0B0B}
.btn.sm{padding:6px 12px;min-height:36px;font-size:14px}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--pri);outline-offset:2px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--ln);border-radius:999px;padding:8px 14px;background:var(--sf);color:var(--ink);font:600 14px Manrope,sans-serif;min-height:40px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--grad);color:#0B0B0B;border-color:var(--pri)}
.lang{display:flex;gap:6px;justify-content:flex-end;margin-bottom:8px}.chip.sm{min-height:32px;padding:4px 12px;font-size:13px}
label{display:block;margin-top:16px;font-weight:600}
input,select,textarea{width:100%;margin-top:6px;padding:11px 12px;border:1.5px solid var(--ln);border-radius:10px;background:var(--bg);color:var(--ink);font:500 16px Manrope,sans-serif}
input[type=range]{padding:0;accent-color:var(--pri);background:none;border:0}
.err{color:var(--bad);font-weight:600;min-height:1.4em;margin:8px 0 0}
.bar{height:10px;background:var(--ln);border-radius:99px;overflow:hidden;margin:10px 0}
.bar i{display:block;height:100%;background:var(--pri);border-radius:99px;transition:width .3s}
.bar.done i{background:var(--ok)}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.tag{font-size:13px;font-weight:700;padding:2px 10px;border-radius:99px;background:var(--bg);color:var(--mut)}
.tag.ok{color:var(--ok)}
.chart{display:flex;gap:6px;align-items:flex-end;margin-top:10px}
.col{flex:1;text-align:center}.bars{height:100px;display:flex;gap:3px;align-items:flex-end;justify-content:center}
.bars i{width:9px;background:var(--ok);border-radius:4px 4px 0 0}.bars i.b2{background:var(--acc)}
.empty{background:var(--sf);border:1.5px dashed var(--pri);border-radius:18px;padding:22px;text-align:center;color:var(--mut);margin-top:12px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:10px;text-align:center}
.cal span{font-size:13px;color:var(--mut);font-weight:700}
.day{position:relative;aspect-ratio:1;min-height:42px;border:0;border-radius:12px;background:var(--bg);color:var(--ink);font:600 15px Manrope,sans-serif;cursor:pointer}
.day.t{box-shadow:inset 0 0 0 2px var(--pri)}.day[aria-pressed="true"]{background:var(--grad);color:#0B0B0B;box-shadow:inset 0 0 0 2px var(--pri)}
.dots{position:absolute;bottom:4px;left:0;right:0;display:flex;gap:3px;justify-content:center}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--acc)}
.player{background:var(--hero);color:var(--onhero);border-radius:14px;padding:26px;text-align:center;margin-top:10px}
.rec{color:var(--bad);font:800 28px var(--fd)}
#tabs{position:fixed;left:0;right:0;bottom:0;background:var(--sf);border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom,0px)}
#tabs div{max-width:480px;margin:0 auto;display:flex}
#tabs button{flex:1;background:none;border:0;color:var(--mut);font:700 11px Manrope,sans-serif;padding:9px 0 8px;min-height:56px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px}
#tabs button[aria-current="page"]{color:var(--pri)}
#tabs svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:12px;font-weight:700;opacity:0;pointer-events:none;transition:.25s;max-width:90vw;text-align:center}
#toast.on{opacity:1;transform:translateX(-50%)}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}

h1{font-size:38px}h2{font-size:27px}h3{font-family:Manrope,sans-serif;font-size:16px}
.btn,.btn.lite{color:#fff}.btn.lite{background:#fff;color:var(--pri)}
.chip[aria-pressed="true"]{background:var(--pri);color:#fff;border-color:var(--pri)}
.day[aria-pressed="true"]{background:var(--pri);color:#fff;box-shadow:none}
.card{box-shadow:0 6px 18px rgba(119,47,52,.07);border-radius:20px}
.logo{display:block;margin:0 auto}
.avatar{width:42px;height:42px;border-radius:50%;border:0;background:var(--pri);color:#fff;font:700 17px Manrope,sans-serif;cursor:pointer}
.mot{position:relative;overflow:hidden;border-radius:26px;padding:20px;margin-top:14px;color:#fff;background:linear-gradient(160deg,#4A2A31 0%,#7A2E35 62%,#9A5A62 100%);min-height:190px}
.mot>*{position:relative}.mot small{color:#F1DEE1;font-weight:700}.mot .q{font-size:27px;max-width:72%;margin:8px 0 16px}
.mot svg{position:absolute;right:-6px;bottom:0;width:62%;opacity:.35}
.rings{display:flex;gap:8px}.ring{flex:1;text-align:center;font-size:13px;font-weight:600;color:var(--mut)}.ring svg{width:68px;height:68px;display:block;margin:0 auto 4px}
.tipc{display:flex;gap:12px;justify-content:space-between;align-items:center;text-align:left;width:100%;background:var(--sf);border:1px solid var(--ln);border-radius:18px;padding:14px;margin-top:10px;color:var(--ink);font:600 15px/1.35 Manrope,sans-serif;cursor:pointer}
.ctag{display:inline-block;font-size:12px;font-weight:700;color:var(--ok);background:#E4EDE6;border-radius:99px;padding:2px 10px;margin-bottom:4px}
.lead{font:700 25px/1.15 var(--fd);color:var(--pri);margin:8px 0 12px}
.tip ul{padding-left:20px;margin:6px 0}.tip li{margin:6px 0}
.acr{display:flex;gap:14px;align-items:center;margin-top:10px}.acr b{font:700 38px var(--fd);color:var(--pri);width:30px;text-align:center}.acr span{font-weight:700}
.code{letter-spacing:.45em;text-align:center;font-size:26px}
.demo{background:#E4EDE6;color:#27452F;border-radius:12px;padding:10px 12px;font-weight:600}
.menu{display:flex;width:100%;justify-content:space-between;background:var(--sf);border:1px solid var(--ln);border-radius:16px;padding:14px;margin-top:10px;color:var(--ink);font:600 15px Manrope,sans-serif;cursor:pointer}
</style></head>
<body>
<main class="app" id="view" aria-live="polite"></main>
<nav id="tabs" aria-label="Pagrindinė navigacija" hidden><div>
<button data-a="tab" data-t="home"><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8v10H3z"/></svg>Pagrindinis</button>
<button data-a="tab" data-t="mood"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8 14s1.5 2 4 2 4-2 4-2M9 9h.01M15 9h.01"/></svg>Savijauta</button>
<button data-a="tab" data-t="tips"><svg viewBox="0 0 24 24"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-4 10.5c.7.7 1 1.5 1 2.5h6c0-1 .3-1.8 1-2.5A6 6 0 0 0 12 3z"/></svg>Patarimai</button>
<button data-a="tab" data-t="cal"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Kalendorius</button>
<button data-a="tab" data-t="prof"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>Profilis</button>
</div></nav>
<div id="toast" role="status"></div>
<script>
const $=s=>document.querySelector(s),KEY='stiprus-v1';
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const today=new Date(),T=iso(today),addDays=n=>{const d=new Date(today);d.setDate(d.getDate()+n);return iso(d)};
const MON=['sausio','vasario','kovo','balandžio','gegužės','birželio','liepos','rugpjūčio','rugsėjo','spalio','lapkričio','gruodžio'];
const MONN=['Sausis','Vasaris','Kovas','Balandis','Gegužė','Birželis','Liepa','Rugpjūtis','Rugsėjis','Spalis','Lapkritis','Gruodis'];
const WD=['Sekmadienis','Pirmadienis','Antradienis','Trečiadienis','Ketvirtadienis','Penktadienis','Šeštadienis'],DOW=['Pr','An','Tr','Kt','Pn','Št','Sk'];
const fmt=s=>{const p=s.split('-');return +p[2]+' '+MON[p[1]-1]};
const EMO=[['😊','Ramus'],['⚡','Energingas'],['🎯','Susikaupęs'],['😴','Pavargęs'],['😬','Įsitempęs'],['😔','Liūdnas']];
const EVT={tr:['Treniruotė','--pri'],va:['Varžybos','--acc'],da:['Svarbi data','--bad']};
const QS=['Šiandien užtenka vieno geresnio bandymo nei vakar.','Klaida yra informacija, o ne nuosprendis.','Pasiruošimas prasideda nuo to, kaip tu kalbi su savimi.','Nebūtina jaustis tobulai, kad pradėtum.','Maži žingsniai kasdien pasiekia toliau nei vienas šuolis.','Tavo tempas yra tavo. Svarbiausia nesustoti.'];
const seed=()=>({name:'',mood:[{d:addDays(-4),emo:1,mot:4,con:3,note:''},{d:addDays(-3),emo:3,mot:2,con:2,note:'Sunki treniruotė, energijos beveik neliko.'},{d:addDays(-2),emo:2,mot:3,con:3,note:''},{d:addDays(-1),emo:0,mot:4,con:4,note:'Gerai sekėsi technika.'}],
goals:[{id:1,t:'Pagerinti 100 m rezultatą 0,3 s',k:'s',p:40},{id:2,t:'Prieš varžybas miegoti bent 8 val.',k:'a',p:70}],
events:[{id:1,d:addDays(1),tm:'17:30',t:'Treniruotė salėje',k:'tr'},{id:2,d:addDays(9),tm:'10:00',t:'Rajono čempionatas',k:'va'},{id:3,d:addDays(14),tm:'',t:'Pokalbis su treneriu',k:'da'}],
caps:[{id:1,t:'Prieš pirmą čempionatą',o:addDays(-10),len:47,note:'Pasakiau sau, kad nebijočiau suklysti.'},{id:2,t:'Kur būsiu po pusmečio',o:addDays(120),len:62,note:''}]});
let S,tab='home',qi=0,F={emo:null,mot:3,con:3,note:''},ui={gf:0,open:0,onErr:''},C={rec:0,sec:0},cm=[today.getFullYear(),today.getMonth()],sel=T,tmr;
const LS=(k,v)=>{try{if(v===undefined)return JSON.parse(localStorage.getItem(k));localStorage.setItem(k,JSON.stringify(v))}catch(e){return null}};
let U=null,auth='in';
const load=em=>{U=em;S=LS(KEY+':'+em);if(!S||!S.mood){S=seed();S.name=((LS('stiprus-users')||{})[em]||{}).name||''}};
const save=()=>{if(U)LS(KEY+':'+U,S)};
const hash=async(p,s)=>[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s+p)))].map(b=>b.toString(16).padStart(2,'0')).join('');
{const em=LS('stiprus-session');if(em&&(LS('stiprus-users')||{})[em])load(em)}
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&!U&&e.target.matches('input')){const b=$('[data-a=reg],[data-a=login]');if(b)b.click()}});
let tt;const toast=m=>{const t=$('#toast');t.textContent=tr(m);t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),2400)};
const mToday=()=>S.mood.find(m=>m.d===T);
const streak=()=>{let n=0,d=new Date(today);if(!mToday())d.setDate(d.getDate()-1);while(S.mood.some(m=>m.d===iso(d))){n++;d.setDate(d.getDate()-1)}return n};
const left=o=>Math.ceil((new Date(o)-new Date(T))/864e5);
const evSort=(a,b)=>(a.d+a.tm)<(b.d+b.tm)?-1:1;
const mmss=s=>Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
const V={
home(){const m=mToday(),ev=S.events.filter(e=>e.d>=T).sort(evSort)[0],g=S.goals.find(x=>x.p<100),c=S.caps.filter(x=>x.o>T).sort((a,b)=>a.o<b.o?-1:1)[0],st=streak();
return `<div class="row"><p class="mut">${WD[today.getDay()]}, ${fmt(T)}</p><button class="btn ghost sm" data-a="logout">Atsijungti</button></div><h1>Labas, ${esc(S.name)}</h1>
<section class="hero" aria-label="Dienos mintis"><p class="q">${QS[qi]}</p><button class="btn lite" data-a="quote">Kita mintis</button></section>
${m?`<div class="card"><h3>Šiandienos savijauta išsaugota</h3><p>${EMO[m.emo][0]} ${EMO[m.emo][1]}. Motyvacija ${m.mot}/5, pasitikėjimas ${m.con}/5.</p>${st?`<p class="mut">Pildai ${st} d. iš eilės.</p>`:''}</div>`
:`<div class="card"><h3>Kaip jautiesi šiandien?</h3><p class="mut">Pažymėti užtrunka minutę.</p><button class="btn" data-a="tab" data-t="mood">Pažymėti savijautą</button></div>`}
${ev?`<div class="card"><h3>Artimiausias įvykis</h3><p><b>${esc(ev.t)}</b></p><p class="mut">${ev.d===T?'Šiandien':fmt(ev.d)}${ev.tm?', '+ev.tm:''} (${EVT[ev.k][0]})</p></div>`:''}
${g?`<div class="card"><h3>Tikslas progrese</h3><p>${esc(g.t)}</p><div class="bar"><i style="width:${g.p}%"></i></div><p class="mut">${g.p}% įvykdyta</p></div>`:''}
${c?`<div class="card"><h3>Žinutė tau ateityje</h3><p>„${esc(c.t)}“ atsidarys ${fmt(c.o)}, už ${left(c.o)} d.</p></div>`:''}`},
mood(){const m=mToday(),days=[...Array(7)].map((_,i)=>addDays(i-6)),hist=[...S.mood].sort((a,b)=>a.d<b.d?1:-1).slice(0,7);
return `<h1>Savijauta</h1><p class="mut">Pažymėk, kaip jautiesi dabar.</p>
<div class="card"><h3>Kokia emocija stipriausia?</h3><div class="chips" role="group" aria-label="Emocija">${EMO.map((e,i)=>`<button class="chip" aria-pressed="${F.emo===i}" data-a="emo" data-i="${i}">${e[0]} ${e[1]}</button>`).join('')}</div><p class="err" id="err" role="alert"></p>
<label>Motyvacija: <b id="lm">${F.mot}</b>/5<input type="range" min="1" max="5" value="${F.mot}" id="rm"></label>
<label>Pasitikėjimas savimi: <b id="lc">${F.con}</b>/5<input type="range" min="1" max="5" value="${F.con}" id="rc"></label>
<label>Pastaba (nebūtina)<textarea id="nt" rows="3">${esc(F.note)}</textarea></label>
<p></p><button class="btn" data-a="savemood">${m?'Atnaujinti savijautą':'Išsaugoti savijautą'}</button></div>
<h2>Paskutinės 7 dienos</h2>${S.mood.length?`<div class="card"><div class="chart" role="img" aria-label="Motyvacijos ir pasitikėjimo grafikas">${days.map(d=>{const e=S.mood.find(m=>m.d===d);return `<div class="col"><div class="bars">${e?`<i style="height:${e.mot*18}px"></i><i class="b2" style="height:${e.con*18}px"></i>`:''}</div><small>${d.slice(8)}</small></div>`}).join('')}</div><small>Žalia: motyvacija. Geltona: pasitikėjimas.</small></div>
${hist.map(e=>`<div class="card"><div class="row"><b>${EMO[e.emo][0]} ${EMO[e.emo][1]}</b><small>${fmt(e.d)}</small></div><small>Motyvacija ${e.mot}/5, pasitikėjimas ${e.con}/5</small>${e.note?`<p>${esc(e.note)}</p>`:''}</div>`).join('')}`
:`<div class="empty">Dar nėra įrašų. Išsaugok pirmąją savijautą ir čia pamatysi savo tendencijas.</div>`}`},
goals(){return `<div class="row"><h1>Tikslai</h1><button class="btn sm" data-a="gform">${ui.gf?'Atšaukti':'Naujas tikslas'}</button></div>
${ui.gf?`<div class="card"><label>Ko nori pasiekti?<input id="gt" maxlength="80"></label><label>Tipas<select id="gk"><option value="s">Sportinis</option><option value="a">Asmeninis</option></select></label><p class="err" id="err" role="alert"></p><button class="btn" data-a="gsave">Išsaugoti tikslą</button></div>`:''}
${S.goals.length?S.goals.map(g=>`<div class="card"><div class="row"><b>${esc(g.t)}</b><span class="tag ${g.p>=100?'ok':''}">${g.p>=100?'Pasiekta':g.k==='s'?'Sportinis':'Asmeninis'}</span></div>
<div class="bar ${g.p>=100?'done':''}" role="progressbar" aria-valuenow="${g.p}" aria-valuemin="0" aria-valuemax="100"><i style="width:${g.p}%"></i></div>
<div class="row"><small>${g.p}%</small><span><button class="btn ghost sm" data-a="gm" data-id="${g.id}" aria-label="Sumažinti progresą">−10%</button> <button class="btn ghost sm" data-a="gp" data-id="${g.id}" aria-label="Padidinti progresą">+10%</button> <button class="btn ghost sm" data-a="gd" data-id="${g.id}">Ištrinti</button></span></div></div>`).join('')
:`<div class="empty">Dar neturi tikslų. Pradėk nuo vieno, kurį gali pasiekti per mėnesį.</div>`}`},
cal(){const [y,m]=cm,off=(new Date(y,m,1).getDay()+6)%7,n=new Date(y,m+1,0).getDate(),ev=d=>S.events.filter(e=>e.d===d),list=ev(sel).sort(evSort);
let cells=DOW.map(d=>`<span>${d}</span>`).join('')+'<i></i>'.repeat(off);
for(let i=1;i<=n;i++){const d=iso(new Date(y,m,i)),es=ev(d);cells+=`<button class="day ${d===T?'t':''}" aria-pressed="${d===sel}" data-a="day" data-d="${d}" aria-label="${fmt(d)}${es.length?', įvykių: '+es.length:''}">${i}${es.length?`<span class="dots">${es.slice(0,3).map(()=>'<i></i>').join('')}</span>`:''}</button>`}
return `<h1>Kalendorius</h1><div class="card"><div class="row"><button class="btn ghost sm" data-a="cp" aria-label="Ankstesnis mėnuo">‹</button><b>${MONN[m]} ${y}</b><button class="btn ghost sm" data-a="cn" aria-label="Kitas mėnuo">›</button></div><div class="cal">${cells}</div></div>
<h2>${fmt(sel)}</h2>${list.length?list.map(e=>`<div class="card row"><span><b>${esc(e.t)}</b><br><small>${EVT[e.k][0]}${e.tm?', '+e.tm:''}</small></span><button class="btn ghost sm" data-a="ed" data-id="${e.id}">Ištrinti</button></div>`).join(''):`<div class="empty">Šią dieną nieko neplanuota.</div>`}

['Koncentracija','Kaip susikaupti prieš varžybas?','Sugrįžk į savo dėmesio centrą.',['Kai galvoji apie rezultatą, varžovus ar kitų lūkesčius, gali būti sunkiau susitelkti į savo veiksmus.'],'Išbandyk 3 žingsnius:',['Atsistok patogiai ir kelis kartus ramiai įkvėpk.','Pastebėk aplinką ir savo kūno pojūčius.','Pasirink vieną žodį, kuris padės susikaupti: „Tikslumas“, „Ritmas“, „Drąsa“.'],['Tada nukreipk dėmesį į pirmą savo veiksmą.','Tu negali kontroliuoti visko, kas vyks varžybose. Tačiau gali treniruoti savo dėmesį.']],
['Emocijų valdymas','Ką daryti po klaidos?','Viena klaida neapibrėžia tavo pasirodymo.',['Klaida gali sukelti pyktį, nusivylimą ar norą viską mesti. Tačiau ilgai galvodamas apie ją gali prarasti dėmesį kitam veiksmui.'],'Tavo 10 sekundžių rutina:',['Pripažink: „Taip, suklydau.“','Iškvėpk ir atpalaiduok kūną.','Pasakyk sau: „Kitas veiksmas.“','Grįžk į žaidimą ar treniruotę.'],['Po treniruotės gali analizuoti klaidą. Varžybų metu tavo tikslas – grįžti į procesą.']],
['Motyvacija','Kai trūksta motyvacijos','Nelauk, kol atsiras noras.',['Motyvacija ne visada būna vienoda. Kartais jautiesi pasiruošęs įveikti bet kokį iššūkį, o kartais net pradėti treniruotę atrodo sunku.'],'Išbandyk:',['Sumažink savo tikslą.','Susitelk į pirmąsias 5 minutes.','Prisimink, kodėl pradėjai.','Įvertink savo savijautą ir fizinį nuovargį.'],['Jeigu esi išsekęs, poilsis gali būti tinkamesnis pasirinkimas nei papildomas spaudimas sau.','Motyvacija gali ateiti pradėjus veikti. Tačiau mokėjimas pailsėti taip pat yra sportininko įgūdis.']],
['Prieš varžybas','Kaip sumažinti jaudulį prieš startą?','Jaudulys nėra tavo priešas.',['Prieš varžybas gali padažnėti širdies plakimas, įsitempti raumenys ar atsirasti nerimas. Tai natūrali organizmo reakcija į svarbią situaciją.'],'Pabandyk šį pratimą:',['Patogiai atsisėsk arba atsistok.','Įkvėpk ramiai.','Iškvėpk šiek tiek lėčiau nei įkvėpei.','Pakartok kelis kartus.','Paklausk savęs: „Koks mano pirmas veiksmas?“'],['Nereikia visiškai panaikinti jaudulio. Mokykis jį priimti ir nukreipti dėmesį į savo užduotį.']],
['Pasitikėjimas savimi','Nustok lyginti save su kitais','Tavo progresas turi savo tempą.',['Lygindamas save su kitais gali pamiršti, kiek pats jau pasiekei.','Kiekvienas sportininkas turi skirtingą patirtį, galimybes ir kelią.'],'Šiandien paklausk savęs:',['Ką šiandien darau geriau nei anksčiau?','Kokį įgūdį tobulinu?','Kuo galiu didžiuotis?'],['Vietoj klausimo „Ar esu geresnis už kitus?“ pabandyk klausti „Ar šiandien žengiau žingsnį pirmyn?“']],
['Po nesėkmės','Kaip atsigauti po pralaimėjimo?','Rezultatas yra tavo patirties dalis, ne tavo vertė.',['Pralaimėjimas gali būti skaudus. Leisk sau jausti nusivylimą, tačiau nepaversk vieno rezultato savo gebėjimų ar vertės įrodymu.'],'Po varžybų atlik trumpą refleksiją:',['Kas man šiandien pavyko?','Ko išmokau?','Ką galiu kontroliuoti kitą kartą?','Kokio vieno dalyko noriu išmokti?'],['Ne kiekvienas pralaimėjimas iškart tampa pamoka. Kartais pirmiausia reikia laiko atsistatyti.']],
['Pasitikėjimas savimi','Pasitikėjimas savimi prasideda nuo mažų veiksmų','Įrodyk sau, kad gali laikytis savo žodžio.',['Pasitikėjimas savimi auga ne tik iš pergalių. Jis gali stiprėti ir tada, kai nuosekliai dirbi, laikaisi savo tikslų bei pastebi savo pastangas.','Šios savaitės iššūkis: pasirink vieną nedidelį tikslą, kurį gali kontroliuoti.'],'Pavyzdžiui:',['Atlikti savo pasiruošimo rutiną.','Treniruotėje išlaikyti dėmesį.','Po klaidos grįžti į procesą.','Po treniruotės užrašyti vieną dalyką, kuris pavyko.'],['Savaitės pabaigoje įvertink, kaip sekėsi.']],
['Atsistatymas','Kai jautiesi pavargęs nuo sporto','Tavo kūnas ir protas yra viena komanda.',['Nuolatinis spaudimas, dideli lūkesčiai ir poilsio trūkumas gali paveikti tavo motyvaciją bei savijautą.'],'Atkreipk dėmesį:',['Ar pastaruoju metu pakankamai miegi?','Ar treniruotėse vis dažniau jautiesi išsekęs?','Ar vis dar jauti džiaugsmą sportuodamas?','Ar gali pasikalbėti apie savo sunkumus?'],['Poilsis nėra silpnumas. Jei sunkumai užsitęsia, verta kreiptis į trenerį, sporto psichologą ar sveikatos specialistą.']],
['Emocijų valdymas','Dienos iššūkis – 3 dalykai, už kuriuos gali sau padėkoti','Pastebėk ne tik tai, kas nepavyko.',['Sportininkai dažnai daug dėmesio skiria klaidoms ir trūkumams. Tačiau svarbu pastebėti ir savo pastangas.'],'Šiandien užrašyk:',['Vieną dalyką, kurį padarei gerai.','Vieną dalyką, kurį išmokai.','Vieną dalyką, kuriuo didžiuojiesi.'],['Tai gali būti net labai maži dalykai.','Augimas prasideda tada, kai išmoksti matyti ne tik savo trūkumus, bet ir stiprybes.']]];
const CH=[['Pastebėk savo mintis.','Užrašyk tris mintis, kurios dažniausiai kyla prieš treniruotę.'],['Susikurk pasiruošimo rutiną.','Pasirink 3 veiksmus, kuriuos atliksi prieš treniruotę ar varžybas.'],['Išbandyk pozityvią, realistišką savikalbą.','Pasirink vieną frazę, kuri padeda tau susikaupti.'],['Mokykis reaguoti į klaidas.','Po kiekvienos klaidos pabandyk grįžti į kitą veiksmą.'],['Susitelk į procesą.','Pasirink vieną tikslą, kurį gali kontroliuoti.'],['Pastebėk savo stiprybes.','Užrašyk tris dalykus, kuriais didžiuojiesi.'],['Atlik refleksiją.','Paklausk savęs: „Ką sužinojau apie save per šią savaitę?“']];
const ACR=[['A','Awareness','Sąmoningumas'],['T','Tenacity','Atkaklumas'],['H','Harmony','Pusiausvyra'],['M','Motivation','Motyvacija'],['O','Optimism','Pozityvus požiūris'],['R','Resilience','Psichologinis atsparumas'],['E','Excellence','Meistriškumas']];
const lg=w=>`<img class="logo" src="${LOGO}" alt="Athmore – sporto psichologija" style="width:${w}px;height:auto">`;
const ring=(p,l)=>`<div class="ring"><svg viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="26" fill="none" style="stroke:var(--ln)" stroke-width="7"/><circle cx="32" cy="32" r="26" fill="none" style="stroke:var(--ok)" stroke-width="7" stroke-linecap="round" stroke-dasharray="${p*1.634} 163.4" transform="rotate(-90 32 32)"/><text x="32" y="37" text-anchor="middle" font-size="15" font-weight="700" style="fill:var(--ink)">${p}%</text></svg>${l}</div>`;
const tipRow=i=>`<button class="tipc" data-x="to" data-id="${i}"><span><span class="ctag">${TIPS[i][0]}</span><br>${TIPS[i][1]}</span><span>${TP().d[i]?'✓':'›'}</span></button>`;
const bk=()=>`<button class="btn ghost sm" data-a="tab" data-t="prof">‹ Atgal</button>`;
const _g=V.goals,_c=V.caps;V.goals=()=>bk()+_g();V.caps=()=>bk()+_c();
const authView2=()=>{if(auth==='verify'){const u=(LS('stiprus-users')||{})[pend]||{};return `<div style="margin:24px 0 8px">${lg(190)}</div><div class="card"><h3>Patvirtink el. paštą</h3><p class="mut">Išsiuntėme 6 skaitmenų kodą į <b>${esc(pend||'')}</b></p><p class="demo">Prototipe laiškas nesiunčiamas. Jūsų kodas: <b>${u.k||''}</b></p><label>Patvirtinimo kodas<input id="vc" class="code" inputmode="numeric" maxlength="6" autocomplete="one-time-code"></label><p class="err" id="err" role="alert"></p><button class="btn" data-x="vf">Patvirtinti</button> <button class="btn ghost" data-x="vr">Siųsti kodą dar kartą</button><p><button class="btn ghost sm" data-x="vb">‹ Atgal</button></p></div>`}
const a=authView();return `<div style="margin:26px 0 4px">${lg(250)}</div><p class="q" style="text-align:center;font-size:25px;margin:6px 0 4px">Stipresnis protas.<br>Didesni pasiekimai.</p>`+a.slice(a.indexOf('<div class="card">'))+`<p class="mut" style="text-align:center;font-size:13px">Awareness · Tenacity · Harmony · Motivation · Optimism · Resilience · Excellence</p>`};
V.home=()=>{TP();const m=mToday(),L=[...S.mood].sort((a,b)=>a.d<b.d?1:-1)[0],ti=(today.getDate()+today.getMonth())%10,gp=S.goals.length?Math.round(S.goals.reduce((a,g)=>a+g.p,0)/S.goals.length):0,ev=S.events.filter(e=>e.d>=T).sort(evSort)[0],st=streak();
return `<div class="row"><span>${lg(124)}</span><button class="avatar" data-a="tab" data-t="prof" aria-label="Profilis">${esc((S.name||'?')[0].toUpperCase())}</button></div>
<p class="mut" style="margin-top:14px">${WD[today.getDay()]}, ${fmt(T)}</p><h1>Sveiki, ${esc(S.name)}!</h1>
<section class="mot" aria-label="Dienos motyvacija"><small>Dienos motyvacija</small><p class="q">„${TIPS[qi%10][2]}“</p><button class="btn lite" data-a="quote">Kita mintis</button><svg viewBox="0 0 200 100" aria-hidden="true"><path d="M0 100L50 40L80 70L125 15L200 100Z" fill="#fff"/></svg></section>
<h2>Mano progresas</h2><div class="card rings">${ring(L?L.mot*20:0,'Motyvacija')}${ring(L?L.con*20:0,'Pasitikėjimas')}${ring(gp,'Tikslai')}</div>
${m?`<div class="card"><h3>Šiandienos savijauta išsaugota</h3><p>${EMO[m.emo][0]} ${EMO[m.emo][1]}. Motyvacija ${m.mot}/5, pasitikėjimas ${m.con}/5.</p>${st?`<p class="mut">Pildai ${st} d. iš eilės.</p>`:''}</div>`:`<div class="card"><h3>Kaip jautiesi šiandien?</h3><p class="mut">Pažymėti užtrunka minutę.</p><button class="btn" data-a="tab" data-t="mood">Pažymėti savijautą</button></div>`}
<h2>Dienos patarimas</h2>${tipRow(ti).replace('data-x="to"','data-x="gotip"')}
${ev?`<div class="card"><h3>Artimiausias įvykis</h3><p><b>${esc(ev.t)}</b></p><p class="mut">${ev.d===T?'Šiandien':fmt(ev.d)}${ev.tm?', '+ev.tm:''} (${EVT[ev.k][0]})</p></div>`:''}`};
V.tips=()=>{const P=TP();if(tp.open>=0){const i=tp.open,t=TIPS[i];return `<div class="tip"><button class="btn ghost sm" data-x="tb">‹ Atgal</button><p style="margin-top:14px"><span class="ctag">${t[0]}</span></p><h1>${t[1]}</h1><p class="lead">${t[2]}</p>${t[3].map(x=>`<p>${x}</p>`).join('')}<h3>${t[4]}</h3><ul>${t[5].map(x=>`<li>${x}</li>`).join('')}</ul>${t[6].map(x=>`<p>${x}</p>`).join('')}
<div class="row" style="margin-top:16px"><button class="btn ${P.d[i]?'ghost':''}" data-x="td" data-id="${i}">${P.d[i]?'✓ Išbandyta':'Išbandžiau'}</button><button class="btn ghost" data-x="ts" data-id="${i}">${P.s[i]?'★ Išsaugota':'Išsaugoti patarimą'}</button></div>
<div class="card"><label style="margin-top:0">Mano mintys<textarea id="tn" rows="4">${esc(P.n[i]||'')}</textarea></label><p></p><button class="btn" data-x="tn" data-id="${i}">Išsaugoti mintis</button></div></div>`}
const l=TIPS.map((t,i)=>i).filter(i=>tp.f==='Visi'||(tp.f==='Mano sąrašas'?P.s[i]:TIPS[i][0]===tp.f)),ch=S.ch||[];
return `<h1>Patarimai</h1><p class="mut">Trumpi psichologiniai patarimai sportininkams (lietuvių kalba).</p><div class="chips" style="margin-top:12px">${CATS.map(c=>`<button class="chip sm" aria-pressed="${tp.f===c}" data-x="tf" data-v="${c}">${c}</button>`).join('')}</div>
${l.length?l.map(tipRow).join(''):`<div class="empty">Dar nėra išsaugotų patarimų.</div>`}
<h2>7 dienų psichologinio pasiruošimo iššūkis</h2><p class="mut">${ch.filter(Boolean).length}/7</p>${CH.map((c,i)=>`<button class="tipc" data-x="ch" data-id="${i}" aria-pressed="${!!ch[i]}"><span><b>Diena ${i+1}</b>. ${c[0]}<br><small>${c[1]}</small></span><span>${ch[i]?'✓':'○'}</span></button>`).join('')}<p class="mut">Nereikia visko atlikti tobulai. Svarbiausia – pradėti.</p>`};
V.prof=()=>{const P=TP();return `<h1>Profilis</h1><div class="card row"><span style="display:flex;gap:12px;align-items:center"><span class="avatar" style="display:grid;place-items:center">${esc((S.name||'?')[0].toUpperCase())}</span><span><b>${esc(S.name)}</b><br><small>${esc(U)}</small></span></span><span class="ctag">El. paštas patvirtintas</span></div>
<div class="card"><p>Išbandyti patarimai: <b>${Object.values(P.d).filter(Boolean).length}/10</b></p><p>Išsaugoti patarimai: <b>${Object.values(P.s).filter(Boolean).length}</b></p><p>Savijautos įrašai: <b>${S.mood.length}</b></p><p>7 dienų psichologinio pasiruošimo iššūkis: <b>${(S.ch||[]).filter(Boolean).length}/7</b></p></div>
<button class="menu" data-a="tab" data-t="goals">Mano tikslai <span>›</span></button><button class="menu" data-a="tab" data-t="caps">Žinutė sau ateityje <span>›</span></button><button class="menu" data-a="tab" data-t="about">Apie ATHMORE <span>›</span></button><p><button class="btn ghost" data-a="logout">Atsijungti</button></p>`};
V.about=()=>bk()+`<div style="margin:16px 0">${lg(260)}</div><p class="lead" style="text-align:center">Daugiau nei fizinis pasiruošimas.</p><div class="card">${ACR.map(r=>`<div class="acr"><b>${r[0]}</b><span>${r[1]}<br><small>${r[2]}</small></span></div>`).join('')}</div><div class="card"><h3>ATHMORE priminimas</h3><p>Stiprus sportininkas nėra tas, kuris niekada neabejoja. Stiprus sportininkas yra tas, kuris mokosi suprasti save, priimti iššūkius ir sugrįžti į savo kelią.</p><p class="lead">Treniruok ne tik kūną. Treniruok ir protą.</p></div>`;
document.addEventListener('click',e=>{const b=e.target.closest('[data-x]');if(!b)return;const x=b.dataset.x,i=+b.dataset.id,P=TP();
if(x==='tf'){tp.f=b.dataset.v;tp.open=-1}
else if(x==='to'){tp.open=i;scrollTo(0,0)}
else if(x==='gotip'){tab='tips';tp.open=i;scrollTo(0,0)}
else if(x==='tb')tp.open=-1;
else if(x==='td'){P.d[i]=!P.d[i];save();if(P.d[i])toast('Super! Patarimas išbandytas')}
else if(x==='ts'){P.s[i]=!P.s[i];save();toast(P.s[i]?'Patarimas išsaugotas':'Patarimas pašalintas iš sąrašo')}
else if(x==='tn'){P.n[i]=$('#tn').value;save();toast('Mintys išsaugotos')}
else if(x==='ch'){S.ch=S.ch||[];S.ch[i]=!S.ch[i];save()}
else if(x==='vf'){const us=LS('stiprus-users')||{},u=us[pend];if(!u||$('#vc').value.trim()!==u.k)return err('Neteisingas kodas.');u.v=1;delete u.k;LS('stiprus-users',us);LS('stiprus-session',pend);load(pend);auth='in';tab='home';toast('El. paštas patvirtintas')}
else if(x==='vr'){const us=LS('stiprus-users')||{};if(us[pend]){us[pend].k=code6();LS('stiprus-users',us)}toast('Kodas išsiųstas iš naujo')}
else if(x==='vb')auth='in';
render()});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='vc'){const b=$('[data-x=vf]');if(b)b.click()}});

render();
</script></body></html>
